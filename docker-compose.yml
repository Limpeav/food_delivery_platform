services:
  postgres:
    image: postgres:16-alpine
    container_name: cravery_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-food_delivery}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-food_delivery}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cravery_network

  redis:
    image: redis:7-alpine
    container_name: cravery_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cravery_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cravery_backend
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-food_delivery}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-604800000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-2592000000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      BAKONG_API_TOKEN: ${BAKONG_API_TOKEN:-}
      BAKONG_ACCOUNT_ID: ${BAKONG_ACCOUNT_ID:-merchant@bakong}
      BAKONG_MERCHANT_NAME: ${BAKONG_MERCHANT_NAME:-Cravery Food Delivery}
      BAKONG_MERCHANT_CITY: ${BAKONG_MERCHANT_CITY:-Phnom Penh}
      BAKONG_API_URL: ${BAKONG_API_URL:-https://api-bakong.nbc.gov.kh/v1}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cravery_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
    container_name: cravery_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - cravery_network

  nginx:
    image: nginx:alpine
    container_name: cravery_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cravery_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  cravery_network:
    driver: bridge
