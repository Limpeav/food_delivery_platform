server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

spring:
  application:
    name: food-delivery-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/food_delivery}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}  # Set DDL_AUTO=validate in production; use Flyway for migrations
    show-sql: false
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour
      cache-null-values: false

jwt:
  secret: ${JWT_SECRET}  # REQUIRED — no default. Generate with: openssl rand -hex 32
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}    # 15 minutes (short-lived)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}  # REQUIRED — no default. Must be set via environment variable.
  storage:
    type: ${STORAGE_TYPE:local} # 'local' or 's3'
    dir: ${UPLOAD_DIR:uploads}
    s3:
      endpoint: ${S3_ENDPOINT:} # e.g. https://<account_id>.r2.cloudflarestorage.com or AWS
      bucket: ${S3_BUCKET:cravery-uploads}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      region: ${S3_REGION:us-east-1}
      public-url: ${S3_PUBLIC_URL:} # e.g. https://cdn.cravery.com

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}  # Set SWAGGER_ENABLED=true in .env for local dev only
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha

bakong:
  token: ${BAKONG_API_TOKEN:}
  account-id: ${BAKONG_ACCOUNT_ID:merchant@bakong}
  merchant-name: ${BAKONG_MERCHANT_NAME:Cravery Food Delivery}
  merchant-city: ${BAKONG_MERCHANT_CITY:Phnom Penh}
  api-url: ${BAKONG_API_URL:https://api-bakong.nbc.gov.kh/v1}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true


